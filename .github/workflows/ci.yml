name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.28"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Ruff check
        run: uv run --no-sync ruff check .
      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Run tests
        run: uv run --no-sync pytest

  packaging-smoke:
    name: Packaging smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Build distributions
        run: uv build --clear
      - name: Select exactly one wheel
        id: wheel
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [[ "${#wheels[@]}" -ne 1 ]]; then
            echo "expected exactly one wheel, found ${#wheels[@]}" >&2
            exit 1
          fi
          printf 'path=%s\n' "${wheels[0]}" >> "$GITHUB_OUTPUT"
      - name: Inspect wheel metadata and contents
        run: uv run --no-sync python scripts/inspect_wheel.py "${{ steps.wheel.outputs.path }}"
      - name: Test both console entrypoints from the wheel
        run: |
          wheel="$(realpath "${{ steps.wheel.outputs.path }}")"
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          cd "$smoke_dir"
          UV_CACHE_DIR="$smoke_dir/cache" uvx --from "$wheel" solwyn --version
          UV_CACHE_DIR="$smoke_dir/cache" uvx --from "$wheel" solwyn-cli --version

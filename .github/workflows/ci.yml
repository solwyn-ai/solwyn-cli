name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  schedule:
    - cron: "23 6 * * 2" # Tuesdays at 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Only PR updates supersede a run; isolate all other runs, including queued pushes.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.11.28"

jobs:
  changes:
    name: Select wheel platforms
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      wheel-os: ${{ steps.matrix.outputs.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Select wheel platforms from the PR diff
        id: matrix
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/wheel-matrix.sh

  quality:
    name: Quality
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Ruff check
        run: uv run --no-sync ruff check .
      - name: Ruff format check
        run: uv run --no-sync ruff format --check .
      - name: Validate offline unpublished Registry draft
        run: uv run --no-sync python scripts/validate_mcp_registry.py
      - name: Check Python example lock
        run: uv lock --check --project examples/mcp/python

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    # Publish separately tests all three Python versions before every release.
    if: >-
      github.event_name != 'push' &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Install actual legacy MCP client
        run: |
          uv venv --python "${{ matrix.python-version }}" "${{ runner.temp }}/mcp-legacy"
          uv pip sync --python "${{ runner.temp }}/mcp-legacy/bin/python" --require-hashes scripts/locks/mcp-legacy.txt
      - name: Run tests
        env:
          SOLWYN_TEST_LEGACY_PYTHON: ${{ runner.temp }}/mcp-legacy/bin/python
        run: uv run --no-sync pytest

  packaging-smoke:
    name: Wheel MCP (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: changes
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.wheel-os) }}
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Run installed-wheel Python, TypeScript, legacy clients and packaged doctor
        run: uv run --no-sync python scripts/mcp_wheel_smoke.py --python "${{ matrix.python-version }}"

name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  UV_VERSION: "0.11.28"

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Ruff check
        run: uv run --no-sync ruff check .
      - name: Ruff format check
        run: uv run --no-sync ruff format --check .
      - name: Run tests
        run: uv run --no-sync pytest
      - name: Build distributions
        run: uv build --no-build-isolation
      - name: Validate distributions
        run: |
          set -euo pipefail

          expected_version="${GITHUB_REF_NAME#v}"
          installed_version="$(uv run --no-sync python -c 'from importlib.metadata import version; print(version("solwyn-cli"))')"
          test "$installed_version" = "$expected_version"

          uv run --no-sync twine check dist/*.whl dist/*.tar.gz

          smoke_venv="$(mktemp -d)"
          trap 'rm -rf "$smoke_venv"' EXIT
          uv venv "$smoke_venv"
          uv pip install --python "$smoke_venv/bin/python" dist/*.whl

          expected_output="solwyn $expected_version"
          test "$("$smoke_venv/bin/solwyn" --version)" = "$expected_output"
          test "$("$smoke_venv/bin/solwyn-cli" --version)" = "$expected_output"
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: dist/
